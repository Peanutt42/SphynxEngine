[package]
name = "sphynx_rendering"
version = "0.1.0"
edition = "2024"

[dependencies]
sphynx_logging = { workspace = true }
sphynx_derive_vertex_attrib = { workspace = true }
sphynx_wesl_include = { workspace = true }
sphynx_egui = { workspace = true, optional = true }
winit = { workspace = true }
wgpu = { workspace = true }
anyhow = { workspace = true }
cgmath = { workspace = true }
bytemuck = { workspace = true }
wavefront = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[features]
default = []
egui = ["dep:sphynx_egui"]
