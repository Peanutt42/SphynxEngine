[package]
name = "sphynx_engine_web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
sphynx_core = { workspace = true }
game = { path = "../../game" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

[features]
default = []
egui = ["sphynx_core/egui"]
