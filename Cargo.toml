[package]
name = "sphynx_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
sphynx_core = { path = "crates/core" }
anyhow = { workspace = true }

[features]
default = []
egui = ["sphynx_core/egui"]

[workspace]
members = [
	"crates/core",
	"crates/logging",
	"crates/input",
	"crates/rendering",
	"crates/derive_vertex_attrib",
]

[workspace.dependencies]
anyhow = "1.0.104" # TODO: remove this
winit = "0.30.13"
wgpu = "30.0.1"
cgmath = "0.18"
bytemuck = { version = "1.25", features = ["derive"] }
wavefront = { version = "0.2.3"}
